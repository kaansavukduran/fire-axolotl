<groupbox id="aionLayoutGroup" data-category="paneGeneral" data-subcategory="aion-layout" hidden="true">
  <label><html:h2 data-aion-l10n="tabLayout"/></label>
  <description data-aion-l10n="tabLayoutHelp"/>
  <html:label for="aion-tab-position" data-aion-l10n="tabPosition"/>
  <html:select id="aion-tab-position" style="font:inherit;padding:.6em;max-width:100%;margin-block:.5em">
    <html:option value="top" data-aion-l10n="tabsTop"/>
    <html:option value="left" data-aion-l10n="tabsLeft"/>
    <html:option value="right" data-aion-l10n="tabsRight"/>
  </html:select>
  <description data-aion-l10n="customizationHelp"/>
  <html:button id="aion-customize-toolbar" data-aion-l10n="customizeToolbar" style="font:inherit;padding:.6em"/>
  <html:label for="aion-website-theme" data-aion-l10n="websiteTheme"/>
  <html:select id="aion-website-theme" style="font:inherit;padding:.6em;margin-block:.5em">
    <html:option value="2" data-aion-l10n="websiteThemeAuto"/>
    <html:option value="0" data-aion-l10n="dark"/>
    <html:option value="1" data-aion-l10n="light"/>
  </html:select>
  <description data-aion-l10n="websiteThemeHelp"/>
  <html:label for="aion-browser-font" data-aion-l10n="browserFont"/>
  <html:select id="aion-browser-font" style="font:inherit;padding:.6em;margin-block:.5em">
    <html:option value="system" data-aion-l10n="systemFont"/>
    <html:option value="opendyslexic">OpenDyslexic</html:option>
    <html:option value="lexend">Lexend</html:option>
    <html:option value="sans">Arial / Helvetica</html:option>
    <html:option value="serif">Georgia</html:option>
  </html:select>
  <description data-aion-l10n="browserFontHelp"/>
  <html:label style="display:flex;align-items:center;gap:.6em;margin-block:.7em">
    <html:input id="aion-newtab-game" type="checkbox"/>
    <html:span data-aion-l10n="newtabGame"/>
  </html:label>
  <description data-aion-l10n="newtabGameHelp"/>
  <html:label for="aion-game-language" data-aion-l10n="newtabGameLanguage"/>
  <html:select id="aion-game-language" style="font:inherit;padding:.6em;margin-block:.5em">
    <html:option value="tr">Türkçe</html:option>
    <html:option value="en">English</html:option>
  </html:select>
  <html:button id="aion-game-reset" data-aion-l10n="newtabGameReset" style="font:inherit;padding:.6em"/>
  <description id="aion-layout-status" role="status"/>
</groupbox>
