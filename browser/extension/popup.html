<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fire Axolotl · Aion</title><link rel="stylesheet" href="ui.css"><script src="shared.js" defer></script><script src="ui.js" defer></script><script src="popup.js" defer></script></head>
<body class="popup"><header><img class="logo" src="icons/96.png" alt="Aion"><div><p class="eyebrow">FIRE AXOLOTL</p><h1 data-i18n="companion"></h1></div><button id="expand-tools" class="secondary" data-i18n="expandTools"></button></header>
<nav class="tool-tabs" role="tablist" data-label="toolsNavigation"><button id="tab-translation" role="tab" aria-controls="panel-translation" data-tool="translation" data-i18n="toolTranslation"></button><button id="tab-containers" role="tab" aria-controls="panel-containers" data-tool="containers" data-i18n="containers"></button><button id="tab-video" role="tab" aria-controls="panel-video" data-tool="video" data-i18n="toolVideo"></button></nav><p id="source-context" class="source-context"></p><p id="status" role="status" aria-live="polite"></p><main>
<p class="notice" data-i18n="prototype"></p>

<section id="panel-containers" role="tabpanel" aria-labelledby="tab-containers"><div class="section-heading"><h2 data-i18n="containers"></h2><span class="pill" data-i18n="separateCookies"></span></div><p data-i18n="containerHelp"></p><div class="notice"><strong data-i18n="containerExampleTitle"></strong><p data-i18n="containerExample"></p><p data-i18n="containerMenuHelp"></p></div>
<div class="row"><label class="grow"><span data-i18n="containerChoice"></span><select id="container"></select></label><button id="open-container" data-i18n="openContainer"></button></div>
<form id="container-form" class="row"><label class="grow"><span data-i18n="newContainer"></span><input id="container-name" maxlength="80" required autocomplete="off" data-placeholder="containerPlaceholder"></label><button type="submit" class="secondary" data-i18n="create"></button></form><button id="temporary-container" class="secondary" data-i18n="temporaryContainer"></button><p data-i18n="temporaryHelp"></p></section>
<section id="panel-video" role="tabpanel" aria-labelledby="tab-video"><h2 data-i18n="video"></h2><p data-i18n="videoHelp"></p><label for="speed" data-i18n="speed"></label><div class="range-row"><input id="speed" type="range" min="0.25" max="4" step="0.05" value="1"><input id="speed-number" type="number" min="0.25" max="4" step="0.05" value="1" data-label="speed"><span>×</span></div><div class="row"><button id="apply-speed" data-i18n="applyVideo"></button><button id="reset-speed" class="secondary" data-i18n="normalSpeed"></button></div>
<label><span data-i18n="preferredQuality"></span><select id="quality"><option value="auto" data-i18n="qualityAuto"></option><option value="best" data-i18n="qualityBest"></option><option value="hd720">720p</option><option value="hd1080">1080p</option><option value="hd1440">1440p</option><option value="hd2160">4K · 2160p</option></select></label><p data-i18n="qualityHelp"></p><div class="row"><button id="apply-quality" class="secondary" data-i18n="applyQuality"></button><button id="read-resolution" class="secondary" data-i18n="readResolution"></button></div><p id="resolution" role="status"></p>
<details><summary data-i18n="dualSubtitles"></summary><p data-i18n="subtitleHelp"></p><label><span data-i18n="originalSubtitle"></span><input id="original-file" type="file" accept=".vtt,.srt,text/vtt"></label><label><span data-i18n="translatedSubtitle"></span><input id="translated-file" type="file" accept=".vtt,.srt,text/vtt"></label><div class="row"><button id="show-subtitles" data-i18n="showSubtitles"></button><button id="hide-subtitles" class="secondary" data-i18n="hideSubtitles"></button></div></details></section>
<section id="panel-translation" role="tabpanel" aria-labelledby="tab-translation"><h2 data-i18n="translate"></h2><div class="translation-native"><span class="pill" data-i18n="onDevice"></span><h3 data-i18n="localTranslationTitle"></h3><p data-i18n="localTranslationHelp"></p><button id="native-translation" data-i18n="openNativeTranslation"></button><details><summary data-i18n="localTranslationGuide"></summary><ol><li data-i18n="nativeStep1"></li><li data-i18n="nativeStep2"></li><li data-i18n="nativeStep3"></li></ol><p data-i18n="nativeAiScope"></p></details></div><div class="translation-service"><h3 data-i18n="serviceTranslationTitle"></h3><p data-i18n="translationHelp"></p><div class="row"><button id="read-selection" class="secondary" data-i18n="readSelection"></button><button id="read-caption" class="secondary" data-i18n="readCaption"></button></div><label><span data-i18n="sourceText"></span><textarea id="source-text" rows="3" maxlength="5000"></textarea></label><label><span data-i18n="targetLanguage"></span><select id="translation-target"><option value="tr">Türkçe</option><option value="en">English</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="es">Español</option><option value="it">Italiano</option><option value="pt">Português</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="ar">العربية</option></select></label><p id="provider" class="notice"></p><button id="translation-settings" class="secondary" data-i18n="translationSetup"></button><button id="translate" data-i18n="sendTranslation"></button><label><span data-i18n="translationResult"></span><textarea id="translation-result" rows="3" readonly></textarea></label><button id="save-word" class="secondary" data-i18n="saveWord"></button></div></section>
<section id="progress-section"><div class="section-heading"><h2 data-i18n="discovery"></h2><span id="progress-count" class="pill"></span></div><progress id="progress-bar" max="3" value="0"></progress><p data-i18n="progressHelp"></p></section>
</main><footer class="tool-footer"><div class="row"><button id="open-characters" class="secondary" data-i18n="characterTitle"></button><button id="settings" class="secondary" data-i18n="settings"></button></div><span data-i18n="localScope"></span></footer></body></html>
