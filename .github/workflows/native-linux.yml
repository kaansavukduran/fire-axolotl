name: Native Linux developer build (not a stable release)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-linux-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      MOZBUILD_STATE_PATH: ${{ github.workspace }}/work/mozbuild
      MACH_INTERACTIVE: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r tests/requirements-gecko.txt
      - run: python3 scripts/fetch_source.py --github-env
      - run: python3 scripts/prepare_source.py "$FIRE_AXOLOTL_SOURCE"
      - run: python3 scripts/verify_component_source.py
      - name: Preserve complete applied source alongside developer binaries
        run: python3 scripts/archive_applied_source.py "$FIRE_AXOLOTL_SOURCE" dist/fire-axolotl-applied-source.tar.zst
      - name: Bootstrap native build dependencies
        working-directory: ${{ env.FIRE_AXOLOTL_SOURCE }}
        run: python3 mach bootstrap --application-choice browser
      - name: Compile the actual fork
        working-directory: ${{ env.FIRE_AXOLOTL_SOURCE }}
        run: python3 mach build
      - run: python3 scripts/fetch_test_runtime.py
      - name: Fresh-profile native built-in and interface smoke test
        env:
          AION_NATIVE_BINARY: ${{ env.FIRE_AXOLOTL_SOURCE }}/obj-fire-axolotl/dist/bin/fire-axolotl
        run: python3 tests/native_smoke.py
      - name: Preserve data across a real browser process restart
        env:
          AION_NATIVE_BINARY: ${{ env.FIRE_AXOLOTL_SOURCE }}/obj-fire-axolotl/dist/bin/fire-axolotl
        run: python3 tests/native_restart.py
      - name: Full integration suite on the compiled fork without injected modules
        env:
          AION_NATIVE_BINARY: ${{ env.FIRE_AXOLOTL_SOURCE }}/obj-fire-axolotl/dist/bin/fire-axolotl
        run: python3 tests/gecko_e2e.py
      - name: Package the tested native browser
        working-directory: ${{ env.FIRE_AXOLOTL_SOURCE }}
        run: python3 mach package
      - name: Verify the real packaged identity, policies and corresponding source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, shutil, sys
          sys.path.insert(0, 'scripts')
          from verify_native_package import verify
          source = Path(os.environ['FIRE_AXOLOTL_SOURCE'])
          packages = list((source / 'obj-fire-axolotl/dist').glob('fire-axolotl-*.tar.xz'))
          if len(packages) != 1:
              raise ValueError(f'Expected exactly one native Linux package, got {packages}')
          destination = Path('dist') / packages[0].name
          shutil.copyfile(packages[0], destination)
          verify(destination)
          shutil.copyfile(source / 'fire-axolotl-build.json', 'dist/fire-axolotl-build.json')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fire-axolotl-linux-developer-build-with-source-NOT-STABLE
          path: dist/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-linux-test-evidence
          path: |
            work/native-test-artifacts/
            work/native-e2e-artifacts/
          retention-days: 14
