name: Native Windows x64 developer build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      PYTHONUTF8: '1'
      MOZBUILD_STATE_PATH: C:\mozstate
      MACH_INTERACTIVE: '0'
      MOZ_AUTOMATION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm run check; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; npm test
      - name: Install hash-pinned MozillaBuild without antivirus exclusions
        run: ./scripts/windows_build.ps1
      - run: python -m pip install -r tests/requirements-gecko.txt zstandard==0.25.0
      - run: python scripts/fetch_source.py
      - run: python scripts/prepare_source.py work/upstream/firefox-153.6.0
      - name: Bootstrap the native Windows toolchain
        working-directory: work/upstream/firefox-153.6.0
        run: python mach --no-interactive bootstrap --application-choice browser --no-system-changes
      - name: Compile the actual Windows Firefox fork
        working-directory: work/upstream/firefox-153.6.0
        run: python mach build
      - name: Package the compiled Windows payload
        working-directory: work/upstream/firefox-153.6.0
        run: python mach package
      - name: Preserve the compiled payload before subsequent installer work
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fire-axolotl-windows-x64-native-payload
          path: |
            work/upstream/firefox-153.6.0/obj-fire-axolotl/dist/fire-axolotl-*.zip
            work/upstream/firefox-153.6.0/obj-fire-axolotl/dist/install/sea/*.exe
          if-no-files-found: error
          retention-days: 14
      - run: python scripts/fetch_test_runtime.py
      - name: Fresh-profile built-in and native interface smoke tests
        env:
          AION_NATIVE_BINARY: ${{ github.workspace }}/work/upstream/firefox-153.6.0/obj-fire-axolotl/dist/bin/fire-axolotl.exe
        run: python tests/native_smoke.py
      - name: Settings and profile data across a real process restart
        env:
          AION_NATIVE_BINARY: ${{ github.workspace }}/work/upstream/firefox-153.6.0/obj-fire-axolotl/dist/bin/fire-axolotl.exe
        run: python tests/native_restart.py
      - name: Full integration suite on the compiled Windows fork
        env:
          AION_NATIVE_BINARY: ${{ github.workspace }}/work/upstream/firefox-153.6.0/obj-fire-axolotl/dist/bin/fire-axolotl.exe
        run: python tests/gecko_e2e.py
      - name: Preserve corresponding applied Windows source
        run: python scripts/archive_applied_source.py work/upstream/firefox-153.6.0 dist/fire-axolotl-windows-applied-source.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fire-axolotl-windows-x64-corresponding-source
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-native-test-evidence
          path: |
            work/native-test-artifacts/
            work/native-e2e-artifacts/
            work/upstream/firefox-153.6.0/obj-fire-axolotl/config.log
          retention-days: 14
