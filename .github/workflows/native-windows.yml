name: Native Windows x64 developer build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/native-windows.yml]
permissions:
  contents: read
concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      PYTHONUTF8: '1'
      MOZBUILD_STATE_PATH: C:\mozstate
      MACH_INTERACTIVE: '0'
      MACH_HIDE_DEV_DRIVE_SUGGESTION: '1'
      FIRE_AXOLOTL_OBJDIR: D:/o
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm run check; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; npm test
      - name: Install hash-pinned MozillaBuild without antivirus exclusions
        run: ./scripts/windows_build.ps1
      - run: python -m pip install -r tests/requirements-gecko.txt zstandard==0.25.0
      - run: python -m unittest discover -s tests -p capture_checks.py
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: objects
        with:
          path: D:/o
          key: windows-native-short-v1-${{ hashFiles('upstream.json', 'windows-build.json', 'browser/mozconfig') }}-${{ github.run_id }}
          restore-keys: windows-native-short-v1-${{ hashFiles('upstream.json', 'windows-build.json', 'browser/mozconfig') }}-
      - run: python scripts/fetch_source.py --destination D:/s --github-env
      - run: python scripts/prepare_source.py "$env:FIRE_AXOLOTL_SOURCE"
      - name: Bootstrap the native Windows toolchain
        shell: C:\mozilla-build\msys2\usr\bin\bash.exe --login -e -o pipefail {0}
        run: |
          repo=$(cygpath -u "$GITHUB_WORKSPACE")
          cd "$(cygpath -u "$FIRE_AXOLOTL_SOURCE")"
          type python3
          python3 --version
          python3 "$repo/scripts/windows_mach.py" --no-interactive bootstrap --application-choice browser --no-system-changes
      - name: Compile the actual Windows Firefox fork
        id: compile
        shell: C:\mozilla-build\msys2\usr\bin\bash.exe --login -e -o pipefail {0}
        run: |
          repo=$(cygpath -u "$GITHUB_WORKSPACE")
          cd "$(cygpath -u "$FIRE_AXOLOTL_SOURCE")"
          python3 "$repo/scripts/windows_mach.py" build
      - name: Package the compiled Windows payload
        shell: C:\mozilla-build\msys2\usr\bin\bash.exe --login -e -o pipefail {0}
        run: |
          repo=$(cygpath -u "$GITHUB_WORKSPACE")
          cd "$(cygpath -u "$FIRE_AXOLOTL_SOURCE")"
          python3 "$repo/scripts/windows_mach.py" package
      - name: Verify the actual offline NSIS installer was packaged
        run: |
          $installers = @(Get-ChildItem 'D:/o/dist/*.installer.exe')
          if ($installers.Count -ne 1 -or $installers[0].Length -lt 50000000) {
            throw 'The full offline NSIS installer is missing from dist/'
          }
      - name: Preserve the compiled payload before subsequent installer work
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fire-axolotl-windows-x64-native-payload
          path: |
            D:/o/dist/fire-axolotl-*.win64.zip
            D:/o/dist/*.installer.exe
          if-no-files-found: error
          retention-days: 14
      - name: Preserve corresponding applied Windows source
        run: python scripts/archive_applied_source.py "$env:FIRE_AXOLOTL_SOURCE" dist/fire-axolotl-windows-applied-source.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fire-axolotl-windows-x64-corresponding-source
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - run: python scripts/fetch_test_runtime.py
      - name: Fresh-profile built-in and native interface smoke tests
        env:
          AION_NATIVE_BINARY: D:/o/dist/bin/fire-axolotl.exe
        run: python tests/native_smoke.py
      - name: Settings and profile data across a real process restart
        env:
          AION_NATIVE_BINARY: D:/o/dist/bin/fire-axolotl.exe
        run: python tests/native_restart.py
      - name: Full integration suite on the compiled Windows fork
        env:
          AION_NATIVE_BINARY: D:/o/dist/bin/fire-axolotl.exe
        run: python tests/gecko_e2e.py
      - name: Normal new-tab Aion game in the compiled Windows product
        env:
          AION_NATIVE_BINARY: D:/o/dist/bin/fire-axolotl.exe
        run: python tests/native_runner.py
      - name: Native language selection and user choices across real restarts
        env:
          AION_NATIVE_BINARY: D:/o/dist/bin/fire-axolotl.exe
        run: python tests/native_localization.py
      - name: Preserve incremental objects even if compilation or tests fail
        if: always() && !cancelled() && steps.compile.outcome != 'skipped'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: D:/o
          key: ${{ steps.objects.outputs.cache-primary-key }}
      - name: Collect configuration evidence under the common work directory
        if: always()
        run: |
          if (Test-Path 'D:/o/config.log') {
            New-Item work/native-config -ItemType Directory -Force | Out-Null
            Copy-Item 'D:/o/config.log' work/native-config/config.log
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-native-test-evidence
          path: |
            work/native-test-artifacts/
            work/native-e2e-artifacts/
            work/runner-test-artifacts/
            work/localization-test-artifacts/
            work/native-config/
          retention-days: 14
