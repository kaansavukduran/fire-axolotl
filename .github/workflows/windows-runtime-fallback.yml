name: Verify bundled Windows runtime fallback
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: fire-axolotl-windows-x64-native-payload
          path: work/windows-inputs
          run-id: 42791204074
          github-token: ${{ github.token }}
      - run: python tests/windows_runtime_fallback.py --package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-runtime-fallback-evidence
          path: |
            work/windows-installer-test/
            work/windows-runtime/collection.json
          retention-days: 14
