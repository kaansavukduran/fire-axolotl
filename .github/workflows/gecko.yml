name: Real Firefox interface and video tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gecko:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r tests/requirements-gecko.txt
      - run: python3 scripts/fetch_test_runtime.py
      - run: python3 scripts/package_extension.py
      - run: python3 tests/gecko_e2e.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: firefox-interface-test-evidence
          path: work/test-artifacts/
          retention-days: 14
