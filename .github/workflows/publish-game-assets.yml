name: Publish pinned offline game component
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-pinned-game-component
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify pinned production bytes, reproduce the archive and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_game_assets.py
