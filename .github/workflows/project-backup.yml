name: Commit-matched project backup
on:
  workflow_dispatch:
  push:
    branches: [codex/native-turkish-localization]
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Scan reachable history, archive sources and verify complete Git bundle
        run: python3 scripts/backup.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commit-matched-source-history-backup
          path: work/backups/
          retention-days: 14
