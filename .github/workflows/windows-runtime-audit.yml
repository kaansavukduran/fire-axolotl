name: Inspect Windows runtime redistribution inputs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Inspect signed Visual C++ application-local runtime and license files
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          $roots = @(Get-Item "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC143.CRT" | Sort-Object FullName -Descending)
          if (!$roots.Count) { throw 'No application-local x64 CRT found' }
          $crt = $roots[0].FullName
          $files = @(Get-ChildItem $crt -File | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            @{name=$_.Name; bytes=$_.Length; version=$_.VersionInfo.FileVersion; sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); signature=[string]$signature.Status; signer=$signature.SignerCertificate.Subject}
          })
          $licenses = @()
          foreach ($base in @("$vs/Licenses", "$vs/VC/Redist", "$vs/Common7/IDE")) {
            if (Test-Path $base) {
              $licenses += @(Get-ChildItem $base -File -Depth 2 -Filter '*licen*' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)
              $licenses += @(Get-ChildItem $base -File -Depth 2 -Filter 'redist*.txt' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)
            }
          }
          New-Item work/runtime-audit -ItemType Directory -Force | Out-Null
          @{visual_studio=$vs; crt_directory=$crt; files=$files; license_files=$licenses} | ConvertTo-Json -Depth 8 | Set-Content work/runtime-audit/inventory.json -Encoding utf8
          $i = 0
          foreach ($license in $licenses) {
            if ($license -match '1033|en-US|en-us') {
              $i++
              Copy-Item $license "work/runtime-audit/license-$i$([IO.Path]::GetExtension($license))"
            }
          }
          Get-Content work/runtime-audit/inventory.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-runtime-audit
          path: work/runtime-audit/
          if-no-files-found: error
          retention-days: 14
