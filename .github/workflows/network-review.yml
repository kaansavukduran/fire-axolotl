name: Review exact published startup network evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements-gecko.txt
      - run: python scripts/fetch_test_runtime.py
      - run: python scripts/review_published_network.py
      - run: python tests/native_network.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: published-network-review-${{ matrix.os }}
          path: work/network-test-artifacts/*.json
          if-no-files-found: error
          retention-days: 14
