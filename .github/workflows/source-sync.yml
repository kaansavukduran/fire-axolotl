name: Preserve complete main source history
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve the complete reachable project history
        run: git bundle create fire-axolotl-main.bundle --all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-history-${{ github.sha }}
          path: fire-axolotl-main.bundle
          if-no-files-found: error
          retention-days: 7
