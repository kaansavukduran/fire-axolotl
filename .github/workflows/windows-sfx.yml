name: Windows installer wrapper check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wrapper:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python scripts/fetch_source.py --github-env
      - run: python scripts/windows_sfx.py --sdk "$env:FIRE_AXOLOTL_SOURCE/other-licenses/7zstub"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: original-brand-windows-sfx
          path: work/windows-sfx/fire-axolotl-setup.sfx
          if-no-files-found: error
