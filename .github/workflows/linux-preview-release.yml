name: Publish tested Linux developer preview
on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Successful reviewed native main-branch build
        default: '42827574889'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-linux-developer-preview
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.3.0
        with:
          node-version: '22'
      - run: npm run check && npm test
      - name: Read the reviewed package version
        run: |
          python3 - <<'PY'
          import json, os
          version = json.load(open('release.json'))['version']
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'AION_PACKAGE_VERSION={version}\n')
          PY
      - name: Verify source-run provenance before downloading binaries
        env:
          GH_TOKEN: ${{ github.token }}
          AION_NATIVE_RUN_ID: ${{ inputs.native_run_id }}
        run: |
          python3 scripts/release_validation.py preflight
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, 'scripts')
          from runner_overlay import check_source_delta
          print('Reviewed UI/data source delta:', check_source_delta(json.load(open('release.json'))['source_commit']))
          PY
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: fire-axolotl-linux-developer-build-with-source-NOT-STABLE
          path: work/release-inputs
          run-id: ${{ inputs.native_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: native-linux-test-evidence
          path: work/release-evidence
          run-id: ${{ inputs.native_run_id }}
          github-token: ${{ github.token }}
      - name: Verify full source, native identity, privacy and test reports
        run: python3 scripts/release_validation.py inputs
      - name: Build actual Linux installer files with pinned tooling
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          version = json.load(open('upstream.json'))['version'].removesuffix('esr')
          subprocess.run([sys.executable, 'scripts/linux_packages.py', f'work/release-inputs/fire-axolotl-{version}.en-US.linux-x86_64.tar.xz'], check=True)
          PY
      - run: python3 -m pip install -r tests/requirements-gecko.txt
      - run: python3 scripts/fetch_test_runtime.py
      - name: Launch the AppImage and compare both installer payloads
        run: python3 scripts/test_linux_installers.py "dist/fire-axolotl-$AION_PACKAGE_VERSION-linux-x86_64.AppImage" "dist/fire-axolotl-$AION_PACKAGE_VERSION-linux-amd64.deb"
      - name: Install the actual Debian package
        run: sudo apt-get install -y "./dist/fire-axolotl-$AION_PACKAGE_VERSION-linux-amd64.deb"
      - name: Test first startup from the installed browser
        env:
          AION_NATIVE_BINARY: /usr/lib/fire-axolotl-preview/fire-axolotl
          AION_NATIVE_ARTIFACTS: ${{ github.workspace }}/work/installed-native-test-artifacts
        run: python3 tests/native_smoke.py
      - name: Test data persistence with the installed browser
        env:
          AION_NATIVE_BINARY: /usr/lib/fire-axolotl-preview/fire-axolotl
        run: python3 tests/native_restart.py
      - name: Full integration on the installed Linux browser
        env:
          AION_NATIVE_BINARY: /usr/lib/fire-axolotl-preview/fire-axolotl
        run: python3 tests/gecko_e2e.py
      - name: New-tab game on the installed Linux browser
        env:
          AION_NATIVE_BINARY: /usr/lib/fire-axolotl-preview/fire-axolotl
        run: python3 tests/native_runner.py
      - name: Native languages and user choices across installed-browser restarts
        env:
          AION_NATIVE_BINARY: /usr/lib/fire-axolotl-preview/fire-axolotl
        run: python3 tests/native_localization.py
      - name: New-tab recovery, wallpaper, default toolbar and isolated temporary tabs
        env:
          AION_NATIVE_BINARY: /usr/lib/fire-axolotl-preview/fire-axolotl
        run: python3 tests/native_newtab.py
      - name: Verify current user-owned Aion Endless Run deployment
        run: python3 scripts/check_game_link.py
      - name: Real toolbar popup, workspace, container menus and two-language accessibility
        env:
          AION_NATIVE_BINARY: /usr/lib/fire-axolotl-preview/fire-axolotl
        run: python3 tests/native_tools.py
      - name: Real native English-Turkish inference and offline reuse after model download
        env:
          AION_NATIVE_BINARY: /usr/lib/fire-axolotl-preview/fire-axolotl
        run: python3 tests/native_translation.py
      - name: Sample actual default new-tab network attempts without TLS exceptions
        env:
          AION_NATIVE_BINARY: /usr/lib/fire-axolotl-preview/fire-axolotl
        run: python3 tests/native_network.py
      - name: Assemble complete source, notices, evidence and checksums
        run: python3 scripts/assemble_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-linux-preview-release-files
          path: dist/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-installer-test-evidence
          path: |
            work/installer-test-artifacts/
            work/installed-native-test-artifacts/
            work/native-test-artifacts/
            work/native-e2e-artifacts/
            work/runner-test-artifacts/
            work/localization-test-artifacts/
            work/tools-test-artifacts/
            work/newtab-test-artifacts/
            work/game-link-verification.json
            work/translation-test-artifacts/*.json
            work/translation-test-artifacts/*.png
            work/network-test-artifacts/results.json
          retention-days: 14
  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: tested-linux-preview-release-files
          path: dist
      - name: Publish only the complete tested preview; preserve existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_preview.py
